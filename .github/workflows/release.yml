name: Release to Amazon EKS

on:
  workflow_run:
    workflows: ["Deploy to Amazon ECR"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install ride-fare-api ./helm \
            --namespace ride-fare \
            --set image.tag=${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/ride-fare-api -n ride-fare
          kubectl get pods -n ride-fare
          kubectl get ingress -n ride-fare

          